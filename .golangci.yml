version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - exhaustive
    - godot

  settings:
    godot:
      scope: toplevel
      period: true
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: false

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - godot
