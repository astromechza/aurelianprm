root = "."
tmp_dir = "dist"

[build]
  cmd = "go build -o ./dist/aurelianprm ./cmd/aurelianprm"
  bin = "./dist/aurelianprm"
  args_bin = ["serve", "--config", "./config.dev.json"]
  include_ext = ["go", "html", "css", "js", "sql"]
  include_dir = ["assets", "internal", "cmd", "migrations"]
  exclude_dir = ["dist", "vendor"]
  delay = 500
  kill_delay = "1s"
  send_interrupt = true

[log]
  time = false

[misc]
  clean_on_exit = true
